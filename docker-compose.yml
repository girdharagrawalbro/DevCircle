version: '3.8'

services:
  database:
    image: mongo:latest
    container_name: devcircle-db
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - devcircle-network

  backend:
    build: ./backend
    container_name: devcircle-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://database:27017/devcircle
      - JWT_SECRET=jwt_secret
      - JWT_REFRESH_SECRET=jwt_refresh_secret
      - JWT_EXPIRES_IN=15m
      - JWT_REFRESH_EXPIRES_IN=7d
      - CLIENT_URL=http://localhost
      - NODE_ENV=production
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - AI_PROVIDER=${AI_PROVIDER}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      - database
    networks:
      - devcircle-network

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=http://localhost:5000/api
        - VITE_SOCKET_URL=http://localhost:5000
    container_name: devcircle-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - devcircle-network

volumes:
  mongo-data:

networks:
  devcircle-network:
    driver: bridge
